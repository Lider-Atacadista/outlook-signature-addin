<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Corporativa - Lider Atacadista & Bem Família</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 550px;
            width: 100%;
            padding: 32px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 8px;
        }
        h1 {
            font-size: 20px;
            margin-top: 16px;
            margin-bottom: 8px;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 20px 0;
        }
        .badges {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }
        .badge {
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="card">
        <div>
            <span class="status-dot"></span>
            <span style="font-size: 13px; font-weight: 600; color: #10b981; text-transform: uppercase; letter-spacing: 0.05em;">Serviço Operacional</span>
        </div>
        <h1>Suplemento de Assinatura Corporativa</h1>
        <p>Este endpoint hospeda a lógica em segundo plano do Suplemento de Assinaturas do Microsoft 365 para as marcas <b>Lider Atacadista</b> e <b>Bem Família</b>.</p>
        <div class="badges">
            <span class="badge">@lideratacadista.com.br</span>
            <span class="badge">@bemfamilia.ind.br</span>
        </div>
    </div>
</body>
</html>
